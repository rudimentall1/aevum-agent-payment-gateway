services:
  aevumpay-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: aevumpay-gateway:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AEVUMPAY_DB: /data/aevumpay-gateway.db
      VERIGATE_PUBLIC_KEY_PATH: /run/secrets/verigate-issuer.pub
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - aevumpay-data:/data
      - ./secrets/verigate-issuer.pub:/run/secrets/verigate-issuer.pub:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  aevumpay-data:
