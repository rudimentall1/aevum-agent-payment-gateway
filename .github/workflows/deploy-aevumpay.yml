name: Deploy AevumPay Router

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      QDAY_RPC_URL: https://rpc-test.qday.info
      AEVUMPAY_CHAIN_ID: "44005"
      AEVUMPAY_TOKEN: "0x456569838f1d43009A91ebA4263147Afd7233483"
      DEPLOYER_PRIVATE_KEY: \${{ secrets.AEVUMPAY_DEPLOYER_PRIVATE_KEY }}
      AEVUMPAY_OWNER: \${{ secrets.AEVUMPAY_OWNER }}
      AEVUMPAY_EXECUTOR: \${{ secrets.AEVUMPAY_EXECUTOR }}
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_PRIVATE_KEY"
          test -n "$AEVUMPAY_OWNER"
          test -n "$AEVUMPAY_EXECUTOR"
          chain_id="$(cast chain-id --rpc-url "$QDAY_RPC_URL")"
          test "$chain_id" = "$AEVUMPAY_CHAIN_ID"
          deployer="$(cast wallet address --private-key "$DEPLOYER_PRIVATE_KEY")"
          test "\${deployer,,}" = "\${AEVUMPAY_OWNER,,}"
          token_code="$(cast code "$AEVUMPAY_TOKEN" --rpc-url "$QDAY_RPC_URL")"
          test "$token_code" != "0x"
          decimals="$(cast call "$AEVUMPAY_TOKEN" "decimals()(uint8)" --rpc-url "$QDAY_RPC_URL")"
          test "$decimals" = "6"
          balance="$(cast balance "$deployer" --rpc-url "$QDAY_RPC_URL")"
          test "$balance" -gt 0
      - name: Deploy router and enable tUSD8
        shell: bash
        run: |
          set -euo pipefail
          forge install foundry-rs/forge-std --no-commit
          forge script script/Deploy.s.sol:DeployAevumPay \
            --rpc-url "$QDAY_RPC_URL" --broadcast -vvvv
      - name: Verify deployment and publish address
        shell: bash
        run: |
          set -euo pipefail
          broadcast_file="broadcast/Deploy.s.sol/$AEVUMPAY_CHAIN_ID/run-latest.json"
          test -f "$broadcast_file"
          router_address="$(python - "$broadcast_file" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          tx = next(
              item for item in data.get("transactions", [])
              if item.get("transactionType") == "CREATE"
              and item.get("contractName") == "AevumPayPolicyRouter"
          )
          print(tx["contractAddress"])
          PY
          )"
          code="$(cast code "$router_address" --rpc-url "$QDAY_RPC_URL")"
          test "$code" != "0x"
          actual_owner="$(cast call "$router_address" "owner()(address)" --rpc-url "$QDAY_RPC_URL")"
          actual_executor="$(cast call "$router_address" "executor()(address)" --rpc-url "$QDAY_RPC_URL")"
          token_enabled="$(cast call "$router_address" "supportedTokens(address)(bool)" "$AEVUMPAY_TOKEN" --rpc-url "$QDAY_RPC_URL")"
          test "\${actual_owner,,}" = "\${AEVUMPAY_OWNER,,}"
          test "\${actual_executor,,}" = "\${AEVUMPAY_EXECUTOR,,}"
          test "$token_enabled" = "true"
          {
            echo "## AevumPay testnet deployment"
            echo "- Router: $router_address"
            echo "- Chain ID: $AEVUMPAY_CHAIN_ID"
            echo "- Owner: $actual_owner"
            echo "- Executor: $actual_executor"
            echo "- tUSD8 enabled: $token_enabled"
            echo "- Explorer: https://explorer-test.qday.info/address/$router_address"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "router_address=$router_address" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: aevumpay-testnet-deployment
          path: broadcast/Deploy.s.sol/44005/run-latest.json
          if-no-files-found: error
