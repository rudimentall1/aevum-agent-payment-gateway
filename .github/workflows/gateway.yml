name: Gateway CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aevumpay
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: aevumpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aevumpay -d aevumpay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AEVUMPAY_TEST_DATABASE_URL: postgresql://aevumpay:test-only-password@localhost:5432/aevumpay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements.txt
      - name: Install gateway dependencies
        run: python -m pip install -r gateway/requirements.txt
      - name: Run gateway unit and PostgreSQL integration tests
        run: python -m pytest gateway/tests -q
      - name: Build gateway container
        run: docker build -f gateway/Dockerfile -t aevumpay-gateway:test .
